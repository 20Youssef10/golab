name: docs

# Publish the modular Jekyll site under docs-site/ to GitHub Pages.
# Every actions/* ref is pinned to a full commit SHA (docs/08 R-13, AUDIT-03).
# The deployment environment is "github-pages" (created by GitHub on first use).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Site prose is extracted from docs/*.md into Jekyll includes. Fail the
      # build if a committed excerpt no longer matches its canonical source.
      - name: Check generated excerpts against canonical docs
        run: python3 docs-site/tools/sync-sources.py --check

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs-site
          destination: ./_site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
