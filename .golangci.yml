version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - errcheck
    - errorlint
    - gosec
    - noctx
    - bodyclose
    - staticcheck
    - govet
    - ineffassign
    - unused
  settings:
    gosec:
      # Re-verified 2026-11-26 with golangci-lint v2.15.0: each remaining
      # exclusion still suppresses only known false positives. G101 flags key
      # *names* and public token URLs, not credentials; G115 conversions are
      # bounded by maxFrameSize/uint32 checks and terminal sizes; G304 reads
      # paths the user explicitly supplied (profiles, requirements, bundle
      # files, scripts, state, resolv.conf); G204 is the user-selected editor;
      # G118 is the connection-scoped stdin loop; G703 is an experimental taint
      # rule on config-derived token paths that are independently Lstat-checked.
      # G704/G705 are deliberately no longer excluded: with current code they
      # produce zero findings, so a blanket suppression would only hide future
      # real findings.
      excludes: [G101, G115, G118, G204, G304, G703]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, errorlint, gosec, noctx, bodyclose, staticcheck]
      - path: internal/testutil/
        linters: [errcheck, errorlint, gosec, noctx, bodyclose, staticcheck]
      - text: "Error return value of .*(fmt\\.Fprint|.*\\.Close)"
        linters: [errcheck]
      # User-facing error strings intentionally mirror upstream's capitalisation
      # and punctuation; ConnectionLost is a published sentinel name.
      - text: "ST1005|ST1012|QF1002"
        linters: [staticcheck]
formatters:
  enable: [gofmt, goimports]
