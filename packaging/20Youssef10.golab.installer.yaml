# winget installer manifest for golab, pinned to the PUBLISHED signed v0.3.0
# release (winget's InstallerType has no tar.gz form, so these are the .zip
# repacks). Each .zip contains golab.exe, golab-mcp.exe, LICENSE/NOTICE/README
# and the two Agent Skills, built from the very same CGO-free artifacts as the
# signed .tar.gz archives consumed by install.sh and `golab update --install`.
#
# BLOCKER RESOLVED: the three InstallerSha256 values below are copied verbatim
# from the signed v0.3.0 checksums.txt (SHA-256 of each .zip, NOT of an
# unpacked .exe and NOT of a .tar.gz repack). The URLs are the canonical
# published release assets; every .zip also has a cosign keyless bundle and a
# signed CycloneDX SBOM attestation. Ready for a winget-pkgs PR.
# `winget validate` was not available in the authoring environment.
#
# BUMP CHECKLIST: publish the annotated v<version> tag first, copy the three
# windows_{amd64,arm64,386} .zip lines from its checksums.txt into
# InstallerSha256, replace every "0.3.0" across all three winget files, and
# keep internal/version.Number and the brew/scoop/nfpm configs on that version.
