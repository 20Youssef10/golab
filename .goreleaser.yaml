# GoReleaser v2 config. Produces CGO-free archives for the Tier-1 matrix
# (docs/04 §1), SHA-256 checksums, and the exact asset names the updater parses
# (internal/update/check.go: asset pattern `golab_*_<os>_<arch>.tar.gz`,
# checksums.txt, *.sigstore.json, *.sbom.sigstore.json).
#
# Every archive carries BOTH static binaries (golab, golab-mcp) and ONE flat
# member, golab-skills.tar.gz, holding both portable Agent Skills. The outer
# archive MUST stay flat: a v0.2.0 binary's safeArchivePath rejects any member
# containing "/", so nested .agents/skills/... entries broke signed self-update
# to v0.3.0. Windows additionally gets a .zip repack from the SAME binaries for
# winget, whose installer type has no tar.gz form; the updater keeps consuming
# the untouched .tar.gz assets.
#
# A SECOND archive, id mcp-standalone, publishes that same golab-mcp binary on
# its own as golab-mcp_<version>_<os>_<arch>.tar.gz (plus a Windows .zip). It
# contains LICENSE/NOTICE/README only - no CLI binary, no skills bundle, no
# changelog - and reuses the reproducible builds and shared checksums.txt above.
# The `default` archive names and flat layout are deliberately untouched:
# signed self-update from v0.2.0 depends on those exact bytes.
#
# Signing (cosign sign-blob + attest-blob) is done in .github/workflows/release.yml
# after this pipeline runs, because the bundles must be uploaded to the same
# GitHub Release. Validate with: goreleaser check && goreleaser release --snapshot --clean
version: 2

project_name: golab

before:
  hooks:
    - go mod download
    # Writes /tmp/golab-skills.tar.gz deterministically. A script (not a shell
    # one-liner) is required: OSS GoReleaser runs hook strings without a shell.
    - ./scripts/make-skills-archive.sh

builds:
  - id: golab
    main: ./cmd/golab
    binary: golab
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # Pin the build timestamp from the commit for reproducible archives.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, "386", arm, riscv64]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: riscv64
  - id: golab-mcp
    # Same static matrix as the CLI: the MCP server is shipped in every
    # archive, not via `go install`, so it has the same signed provenance.
    main: ./cmd/golab-mcp
    binary: golab-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, "386", arm, riscv64]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: riscv64

archives:
  - id: default
    ids: [golab, golab-mcp]
    # The updater expects .tar.gz for EVERY target, including Windows.
    formats: [tar.gz]
    # winget has no tar.gz installer type: emit an additional .zip from the
    # very same binary artifacts. The 13 tar.gz names are unchanged; only the
    # three Windows targets gain a second asset.
    format_overrides:
      - goos: windows
        formats: [tar.gz, zip]
    # No OS/arch "replacements": runtime.GOOS/runtime.GOARCH must match exactly
    # (linux/amd64 -> golab_0.1.0-alpha.1_linux_amd64.tar.gz).
    name_template: "golab_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      # Single FLAT member for backward-compatible self-update. The generated
      # file lives outside dist (which GoReleaser cleans after before hooks);
      # dst renames it so no absolute path leaks into the published archive.
      # install.sh / install.ps1 unpack it into the skills directory.
      - src: "/tmp/golab-skills.tar.gz"
        dst: golab-skills.tar.gz

  # Standalone signed download for the MCP server: only the golab-mcp binary
  # plus LICENSE/NOTICE/README. It reuses the exact same reproducible build
  # artifacts as `default`, so both archives carry identical MCP bytes and are
  # covered by the one checksums.txt. The distinct `golab-mcp_` prefix keeps
  # the updater's `golab_*` asset parsing unambiguous.
  - id: mcp-standalone
    ids: [golab-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [tar.gz, zip]
    name_template: "golab-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  # Must be literally `checksums.txt` (internal/update/check.go:192-195).
  # It now also contains the three winget .zip digests and all 16 standalone
  # golab-mcp archive digests; the updater selects only its platform .tar.gz
  # line, so this is backward compatible.
  name_template: checksums.txt
  algorithm: sha256

release:
  # Keep in sync with the up-to-date repo identity. internal/app pins
  # Owner/Repo to 20Youssef10/golab by default, which matches this repository;
  # update that pin and the verifier SAN if the repo is transferred/renamed.
  github:
    owner: 20Youssef10
    name: golab
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

snapshot:
  version_template: "{{ .Version }}-next"
