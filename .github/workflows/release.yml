name: release

on:
  push:
    tags:
      - "v*"

# Keyless cosign needs the OIDC token. The workflow filename is part of the
# pinned certificate identity in internal/update/verify.go: the SAN regex is
#   ^https://github.com/<Owner>/<Repo>/.github/workflows/release\.yml@refs/tags/v
# It must therefore stay exactly `.github/workflows/release.yml` and only run
# from v* tags; a run on any other ref is not a signed release.
#
# Privilege split: `go mod download`, goreleaser and syft run in the `build`
# job, which has NO id-token permission, so a compromised build-time dependency
# cannot mint a Fulcio signing certificate. Only `sign` holds id-token: write;
# it never checks out the tag or executes build-time code. Both jobs are in
# this same workflow file, so the certificate SAN (job_workflow_ref@ref) stays
# exactly the identity the updater pins.
permissions: {} # default deny; each job grants only what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    # Both halves stay behind the same gate: build publishes the archives,
    # sign attaches the keyless material. GitHub auto-creates the `release`
    # environment on first use, but it gates nothing until a repo admin adds
    # required reviewers there.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser publishes archives + checksums.txt
      # NO id-token: write here, by design (see header).
    env:
      # Exact stable version resolved by the old floating `~> v2` constraint
      # (goreleaser/goreleaser v2.20.3, published 2026-11-20). No floating refs.
      GORELEASER_VERSION: v2.20.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # GoReleaser changelog/tag handling expects an annotated tag (our AGENTS.md
      # release rule). Fail loudly if a lightweight tag was pushed by mistake.
      - name: Require annotated tag
        run: |
          # actions/checkout checks out a detached commit; the tag object may
          # not be present locally even with fetch-depth 0. Fetch it explicitly.
          git fetch origin --tags --force
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" || {
            echo "release requires an annotated tag (git tag -a)" >&2; exit 1;
          }

      # --- Dry-run validation (no publish) ---------------------------------
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Dry-run build (snapshot, no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

      # --- Real release (archives + checksums.txt) --------------------------
      - name: Release archives and checksums
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          # GoReleaser v2 requires GITHUB_TOKEN for GitHub publishing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- CycloneDX SBOM ---------------------------------------------------
      # The pinned sbom-action version has no output-file input and its artifact
      # upload is unreliable; install syft and write the file ourselves.
      # Its default syft v0.42.2 cannot parse `go 1.27.4` in go.mod and emits a
      # zero-component SBOM, so pin a release that catalogs Go modules.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          syft-version: v1.57.2
        id: syft

      - name: Generate CycloneDX SBOM
        # Root-command form works across syft versions; v0.42.2 has no `scan`
        # subcommand ("accepts at most 1 arg(s), received 2"). Pass the action
        # output via env (never interpolate untrusted text into `run:`).
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |-
          "$SYFT" . -o cyclonedx-json=dist/sbom.cdx.json

      # --- Hand-off to the signing job -------------------------------------
      # The whole dist directory is passed so the proof step's
      # `sha256sum -c checksums.txt` sees every file the checker sums. The
      # artifact is an internal hand-off only, not a published release asset.
      - name: Upload dist for signing
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Same environment gate as the build job: a reviewer approval covers both
    # publishing the archives and attaching the signatures.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload attaches bundles to the release
      id-token: write # keyless Fulcio certificate for cosign
    env:
      COSIGN_VERSION: v2.6.5
    steps:
      # No checkout and no build tools here: this job only handles the already
      # built bytes from `build` plus the pinned cosign binary.
      - name: Download dist from build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist-${{ github.sha }}
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # --- Signed artifacts + signed CycloneDX SBOM -------------------------
      - name: Sign archives and attest the SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/golab_*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "no archives built" >&2; exit 1
          fi
          for artifact in "${archives[@]}"; do
            base="$(basename "$artifact")"
            # Keyless signature bundle -> contains "sigstore", not "sbom":
            # internal/update/check.go isSignatureAsset() picks this one.
            # --new-bundle-format is REQUIRED: cosign v2.6.5 otherwise writes a
            # LEGACY bundle (base64Signature/cert/rekorBundle) that the updater's
            # sigstore v0.3 protobuf bundle parser (internal/update/verify.go)
            # cannot read. cosign verify-blob accepts either format, so the cosign
            # proof alone would not catch a regression here (see the format guard
            # in the post-release proof step).
            cosign sign-blob --yes --new-bundle-format --bundle "dist/${base}.sigstore.json" "$artifact"
            # DSSE attestation: subject digest is the *artifact*; predicate is a
            # CycloneDX SBOM. Name matches `*.sbom.sigstore.json`, which is what
            # internal/update/check.go isSBOMAsset() requires. Same v0.3 bundle
            # requirement as sign-blob above.
            # --type must be the EXACT predicate URI the updater accepts, not the
            # `cyclonedx` alias: cosign v2.6.5 maps that alias to in-toto
            # `https://cyclonedx.org/bom`, which internal/update/sbom.go rejects
            # ("SBOM attestation has an unsupported predicate type"). Passing the
            # URI makes attest-blob copy it verbatim into the DSSE statement's
            # predicateType, so already-shipped v0.1.6/v0.1.7 binaries can install
            # this release with no verifier change. The proof step guards it.
            cosign attest-blob --yes --new-bundle-format \
              --type https://cyclonedx.org/schema/bom-1.5 \
              --predicate dist/sbom.cdx.json \
              --bundle "dist/${base}.sbom.sigstore.json" "$artifact"
          done
          # Upload every bundle to the release GoReleaser just created.
          # No --clobber: published signatures/attestations are immutable, so a
          # re-run of this tag must fail here rather than overwrite them.
          gh release upload "$TAG" dist/*.sigstore.json

      # --- Post-release proof ----------------------------------------------
      - name: Verify published asset classes and signing identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Prove the keyless material is valid under the *actual* repo identity.
          # internal/update pins 20Youssef10/golab, which matches this repository;
          # a repo transfer/rename requires updating that pin in internal/app.
          # Assert the pin here so a rename/transfer cannot silently publish
          # signed releases the updater would reject as un-installable.
          test "$GITHUB_REPOSITORY" = "20Youssef10/golab" || {
            echo "FAIL: repository is '$GITHUB_REPOSITORY', expected '20Youssef10/golab'" >&2
            exit 1
          }
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
          for pattern in '^checksums\.txt$' '^golab_.*\.tar\.gz$' \
                         '^golab_.*\.tar\.gz\.sigstore\.json$' \
                         '^golab_.*\.sbom\.sigstore\.json$'; do
            grep -E "$pattern" /tmp/assets.txt >/dev/null || {
              echo "FAIL: no release asset matches $pattern" >&2; exit 1;
            }
          done

          # Every checksum line must match the exact bytes uploaded. GoReleaser
          # writes checksums.txt into dist before signing, and signing only adds
          # sidecar bundles - it never rewrites the archives themselves.
          ( cd dist && test -s checksums.txt && sha256sum -c checksums.txt )

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          shopt -s nullglob

          # (0) Bundle-format guard. The updater (internal/update/verify.go)
          # parses sigstore v0.3 protobuf bundles only; a legacy cosign bundle
          # (base64Signature/cert/rekorBundle) makes `golab update --install`
          # fail with `unknown field "base64Signature"`. cosign verify-blob and
          # verify-blob-attestation auto-detect both formats, so the cosign proof
          # below would pass even if --new-bundle-format were dropped. Assert the
          # format on disk so that regression fails the release loudly instead.
          # jq is preinstalled on GitHub's ubuntu-latest runners.
          fmt_bundles=(dist/golab_*.tar.gz.sigstore.json dist/golab_*.sbom.sigstore.json)
          if (( ${#fmt_bundles[@]} == 0 )); then
            echo "FAIL: no sigstore bundles found for format check" >&2; exit 1
          fi
          for bundle in "${fmt_bundles[@]}"; do
            if ! jq -e '.mediaType | strings | contains("v0.3")' "$bundle" >/dev/null; then
              echo "FAIL: $bundle is not a v0.3 sigstore bundle (.mediaType missing or not v0.3) - legacy bundles break golab update --install" >&2
              exit 1
            fi
            if ! jq -e '.verificationMaterial.tlogEntries[0].inclusionProof' "$bundle" >/dev/null; then
              echo "FAIL: $bundle has no tlogEntries[0].inclusionProof" >&2
              exit 1
            fi
          done
          echo "all ${#fmt_bundles[@]} sigstore bundles are v0.3 format with inclusion proofs"

          # (a) Keyless signature bundle for EVERY archive, not just one sample.
          archive_bundles=(dist/golab_*.tar.gz.sigstore.json)
          if (( ${#archive_bundles[@]} == 0 )); then
            echo "FAIL: no archive signature bundles" >&2; exit 1
          fi
          for bundle in "${archive_bundles[@]}"; do
            artifact="${bundle%.sigstore.json}"
            cosign verify-blob \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --bundle "$bundle" "$artifact"
            echo "verified keyless signature for $(basename "$artifact")"
          done

          # (b) CycloneDX attestation for EVERY SBOM bundle, bound to its exact
          # archive. cosign v2.6.5: verify-attestation verifies <IMAGE> and has
          # no --bundle flag; bundles made by attest-blob are verified with
          # verify-blob-attestation. --check-claims defaults to true, so the
          # in-toto subject digest is checked against the archive bytes.
          #
          # --type is the exact predicate URI the updater accepts, NOT the
          # `cyclonedx` alias (which makes attest-blob emit
          # `https://cyclonedx.org/bom`, rejected by internal/update/sbom.go).
          # cosign's verifier accepts both forms, so also assert the predicate
          # on disk with jq: decode the v0.3 DSSE envelope payload (base64
          # in-toto statement) and require the exact URI. `jq -e` fails on false
          # or null, so a missing field, wrong predicate or malformed payload
          # fails the release loudly instead of shipping an un-installable bundle.
          # cosign v2.6.5's attest-blob puts dsseEnvelope at the ROOT of a v0.3
          # bundle (top-level mediaType/verificationMaterial/dsseEnvelope); an
          # older/nested bundle keeps it under .content. Accept both layouts so
          # the guard checks the payload rather than one storage path - the
          # v0.1.8 release failed at this guard (run 45428451505) with
          # "Malformed BOM" while its published attestation was correct.
          sbom_bundles=(dist/golab_*.sbom.sigstore.json)
          if (( ${#sbom_bundles[@]} == 0 )); then
            echo "FAIL: no SBOM attestation bundles" >&2; exit 1
          fi
          for bundle in "${sbom_bundles[@]}"; do
            artifact="${bundle%.sbom.sigstore.json}"
            if ! jq -e --arg pt "https://cyclonedx.org/schema/bom-1.5" \
              '(.dsseEnvelope.payload // .content.dsseEnvelope.payload) | @base64d | fromjson | .predicateType == $pt' \
              "$bundle" >/dev/null; then
              echo "FAIL: $bundle DSSE predicateType is not https://cyclonedx.org/schema/bom-1.5 - v0.1.6/v0.1.7 updater would reject it" >&2
              exit 1
            fi
            cosign verify-blob-attestation \
              --type https://cyclonedx.org/schema/bom-1.5 \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --bundle "$bundle" "$artifact"
            echo "verified cyclonedx SBOM attestation for $(basename "$artifact")"
          done
          echo "release assets by class:"; cat /tmp/assets.txt
