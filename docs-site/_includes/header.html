<header class="site-header">
  <div class="header-inner">
    <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button"
            aria-controls="site-sidebar" aria-expanded="false" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">g</span>
      <span class="brand-name">golab</span>
      <span class="brand-sub">docs</span>
    </a>
    <div class="header-meta">
      <span class="version-chip" title="Current release">{{ site.release }}</span>
      <span class="header-note">unofficial Go port of the Colab CLI</span>
    </div>
    <nav class="header-links" aria-label="External project links">
      <a href="https://github.com/20Youssef10/golab">GitHub</a>
      <a href="https://github.com/20Youssef10/golab/blob/main/CHANGELOG.md">Changelog</a>
    </nav>
    <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Change colour theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span id="theme-label" class="theme-label">System</span>
    </button>
  </div>
</header>
