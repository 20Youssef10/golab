# Generated from internal/mcpserver/tools.go on 2026-11-28 (25 allow-listed tools).
tools:
  - group: "Read-only (15)"
    items:
      - name: colab_sessions
        summary: "Read-only: list active Colab sessions. Does not allocate, stop or modify anything."
      - name: colab_status
        summary: "Read-only: show the status of one local session, or the current session when name is omitted. No state is changed."
      - name: colab_usage
        summary: "Read-only: show the account compute-unit usage rate and balance. No state is changed."
      - name: colab_cost
        summary: "Read-only: report compute-unit cost samples for the requested window. No state is changed."
      - name: colab_ps
        summary: "Read-only: snapshot kernel processes of a session. No state is changed."
      - name: colab_cat
        summary: "Read-only: print a remote file from a session. Nothing is written on the VM."
      - name: colab_tail
        summary: "Read-only: read trailing lines of a remote file. This tool never follows the file, so it terminates."
      - name: colab_grep
        summary: "Read-only: search files on the VM for a pattern and return matching lines. No state is changed."
      - name: colab_du
        summary: "Read-only: report remote disk usage for a path. No state is changed."
      - name: colab_find
        summary: "Read-only: locate files by name on the VM. No state is changed."
      - name: colab_logs
        summary: "Read-only: read the log of a detached run. This tool does not follow the log, so it terminates."
      - name: colab_wait
        summary: "Read-only: wait for a session to reach kernel, idle or ready state. Polls the existing session; does not allocate."
      - name: colab_jobs
        summary: "Read-only: list detached runs with status, exit code and duration. Starts nothing and holds nothing open."
      - name: colab_doctor
        summary: "Read-only local diagnostics: report config, auth, API, update and wire state. This tool never applies fixes, never runs live probes and never edits files."
      - name: colab_compat
        summary: "Read-only: compare the local command surface against the embedded snapshot. Uses a local snapshot only; makes no network claim."
  - group: "Requires confirm: true (10)"
    items:
      - name: colab_update
        summary: "Check for a newer signed golab release (action=check, read-only) or verify and install it in place (action=install, requires confirm:true). Never accepts or handles tokens."
      - name: colab_install_mcp
        summary: "Install the golab MCP server config for one or more AI agents (opencode, claude-code, cursor, gemini, codex, vscode, or all). dry_run defaults to true; mode=manual returns the snippet and writes nothing; dry_run:false in auto mode requires confirm:true and never stores credentials."
      - name: colab_install_skills
        summary: "Install the two portable Agent Skills into the unified dir, a specific agent dir, the project dir, or all targets. Only known skill trees are copied; traversal and unknown targets are rejected. dry_run defaults to true; copying requires confirm:true."
      - name: colab_reap
        summary: "Prune stale local session records. DRY-RUN BY DEFAULT (dry_run=true): previews changes without mutation. Setting dry_run=false deletes records and requires confirm:true."
      - name: colab_new
        summary: "BILLABLE: allocate a new Colab runtime (optionally with GPU/TPU or high memory). Requires confirm:true; the new VM changes external state."
      - name: colab_exec
        summary: "MUTATING: execute Python code in a session. Code is passed on stdin, never in argv or shell. Requires confirm:true because it runs code on a remote VM."
      - name: colab_run
        summary: "BILLABLE: run a local Python script on a fresh VM, then release it unless keep is set. Requires confirm:true; all flags precede the script path so no user string is forwarded as a flag."
      - name: colab_stop
        summary: "DESTRUCTIVE: release a runtime and discard its state, or all sessions when all is set. Requires confirm:true; this cannot be undone."
      - name: colab_fetch
        summary: "MUTATING: download an HTTPS URL onto the VM, optionally verifying a SHA-256 digest. Requires confirm:true because it writes remote state."
      - name: colab_resume
        summary: "MUTATING: resume an interrupted execution in a session (re-runs remote code). Requires confirm:true."
