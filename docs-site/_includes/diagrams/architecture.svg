<svg viewBox="0 0 880 410" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">golab control plane and data plane</title>
  <desc id="arch-desc">The CLI or MCP server uses an OAuth or ADC bearer token against the control plane to allocate a runtime; the control plane returns a short-lived runtime-proxy token used for kernel WebSocket, contents and SSH traffic. The separate colab auth command injects credentials inside the VM.</desc>
  <defs>
    <marker id="arch-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="arch-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-accent" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="lane" x="228" y="26" width="250" height="300" rx="10"/>
  <text class="small" x="353" y="48" text-anchor="middle">CONTROL PLANE</text>
  <rect class="lane" x="518" y="26" width="336" height="300" rx="10"/>
  <text class="small" x="686" y="48" text-anchor="middle">DATA PLANE</text>

  <rect class="box" x="18" y="92" width="184" height="60" rx="8"/>
  <text class="label" x="110" y="117" text-anchor="middle">golab CLI</text>
  <text class="small mono" x="110" y="137" text-anchor="middle">54 commands</text>
  <rect class="box" x="18" y="178" width="184" height="60" rx="8"/>
  <text class="label" x="110" y="203" text-anchor="middle">golab-mcp</text>
  <text class="small mono" x="110" y="223" text-anchor="middle">22 tools · confirm gate</text>

  <rect class="box-accent" x="248" y="104" width="210" height="76" rx="8"/>
  <text class="label" x="353" y="132" text-anchor="middle">colab.research.google.com</text>
  <text class="small mono" x="353" y="153" text-anchor="middle">assign / unassign / status</text>
  <text class="small" x="353" y="258" text-anchor="middle">OAuth / ADC bearer token</text>
  <text class="small" x="353" y="278" text-anchor="middle">(user control-plane credential)</text>

  <rect class="box-accent" x="538" y="82" width="296" height="54" rx="8"/>
  <text class="label" x="686" y="114" text-anchor="middle">Runtime proxy</text>
  <rect class="box" x="538" y="166" width="296" height="54" rx="8"/>
  <text class="label" x="686" y="198" text-anchor="middle">Jupyter kernel · WebSocket</text>
  <rect class="box" x="538" y="250" width="296" height="54" rx="8"/>
  <text class="label" x="686" y="282" text-anchor="middle">Contents API · embedded SSH</text>
  <text class="small" x="686" y="336" text-anchor="middle">short-lived runtime-proxy token, never the bearer</text>

  <path class="arrow" marker-end="url(#arch-head)" d="M 202 122 L 246 136"/>
  <text class="small" x="224" y="115" text-anchor="middle">new</text>
  <path class="arrow" marker-end="url(#arch-head)" d="M 202 207 L 246 155"/>
  <path class="arrow-accent" marker-end="url(#arch-head-accent)" d="M 458 142 L 536 109"/>
  <text class="small" x="497" y="116" text-anchor="middle">token</text>
  <path class="arrow" marker-end="url(#arch-head)" d="M 686 136 L 686 164"/>
  <path class="arrow" marker-end="url(#arch-head)" d="M 686 220 L 686 248"/>
  <path class="arrow" marker-end="url(#arch-head)" d="M 202 122 C 210 348 470 348 536 277"/>
  <text class="small" x="360" y="353" text-anchor="middle">exec, files, SSH — no local daemon</text>

  <rect class="box" x="228" y="354" width="626" height="44" rx="8"/>
  <text class="small" x="541" y="380" text-anchor="middle">Separate third thing: <tspan class="mono">colab auth</tspan> injects credentials into the VM; it is neither plane token.</text>
</svg>
