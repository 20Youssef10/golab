# winget installer manifest for golab, prepared for the v0.3.0 release that
# publishes Windows .zip repacks (winget's InstallerType has no tar.gz form).
# Each .zip contains golab.exe, golab-mcp.exe, LICENSE/NOTICE/README and the
# two Agent Skills, built from the very same CGO-free artifacts as the signed
# .tar.gz archives consumed by install.sh and `golab update --install`.
#
# RELEASE-TIME STEP (mandatory before a winget-pkgs PR): replace each
# REPLACE_AT_RELEASE value with the matching `golab_0.3.0_windows_<arch>.zip`
# line from the signed v0.3.0 checksums.txt (SHA-256 of the .zip bytes, NOT of
# an unpacked .exe and NOT of the .tar.gz repack). Never submit a manifest
# that still contains a placeholder, an unverified URL or a copied tar.gz
# hash. The release workflow signs, checksums and attestes every .zip asset.
# `winget validate` was not available in the authoring environment.
#
# BUMP CHECKLIST: publish the annotated v<version> tag first, copy the three
# windows_{amd64,arm64,386} .zip lines from its checksums.txt into
# InstallerSha256, replace every "0.3.0" across all three winget files, and
# keep internal/version.Number and the brew/scoop/nfpm configs on that version.
PackageIdentifier: 20Youssef10.golab
PackageVersion: 0.3.0
Platform:
- Windows.Desktop
MinimumOSVersion: 10.0.17763.0
ReleaseDate: "2026-11-27"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: golab.exe
  PortableCommandAlias: golab
- RelativeFilePath: golab-mcp.exe
  PortableCommandAlias: golab-mcp
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/20Youssef10/golab/releases/download/v0.3.0/golab_0.3.0_windows_amd64.zip
  InstallerSha256: REPLACE_AT_RELEASE
- Architecture: arm64
  InstallerUrl: https://github.com/20Youssef10/golab/releases/download/v0.3.0/golab_0.3.0_windows_arm64.zip
  InstallerSha256: REPLACE_AT_RELEASE
- Architecture: x86
  InstallerUrl: https://github.com/20Youssef10/golab/releases/download/v0.3.0/golab_0.3.0_windows_386.zip
  InstallerSha256: REPLACE_AT_RELEASE
ManifestType: installer
ManifestVersion: 1.12.0
