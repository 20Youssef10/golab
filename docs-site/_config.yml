title: golab docs
description: >-
  Documentation for golab, the unofficial single-binary Go port of the
  Google Colab CLI. Canonical prose lives in the repository's docs/ directory.
url: https://20youssef10.github.io
baseurl: /golab
repository: 20Youssef10/golab
release: v0.2.0

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Keep tooling out of the published site. Pages under pages/ are the site's
# own topic pages; _includes/source/ holds generated excerpts of docs/*.md.
exclude:
  - tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
